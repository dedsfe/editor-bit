<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OQJF engine</title>
<style>
  body { margin: 0; background: #0b0b10; color: #ddd; font: 13px ui-monospace, monospace; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  canvas { height: min(80vh, 960px); aspect-ratio: 9 / 16; image-rendering: pixelated; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; width: min(90vw, 540px); }
  .bar input { flex: 1; }
  button { background: #2a2a38; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  body.export .bar { display: none; }
  body.export { padding: 0; }
  body.export canvas { height: auto; }
</style>
</head>
<body>
  <canvas></canvas>
  <div class="bar">
    <button id="play">▶</button>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
    <span id="time">0.00</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
